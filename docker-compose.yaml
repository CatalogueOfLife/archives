version: '3.7'
services:
  database:
    image: mysql:5.7
    # No host port: the database is only reachable from the other services on the compose network.
    volumes:
      - ./data:/home/col/data
      - ./var/lib/mysql:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DATABASE_PASSWORD}
      MYSQL_DATABASE: col
    command: ['mysqld', '--character-set-server=utf8', '--collation-server=utf8_general_ci', '--default_storage_engine=MYISAM', '--secure-file-priv=', '--default-authentication-plugin=mysql_native_password', '--initialize-insecure=false', '--sql-mode=', '--innodb-temp-data-file-path=ibtmp1:12M:autoextend:max:1000M', '--default-tmp-storage-engine=MyISAM']
    restart: unless-stopped
  checklists:
    build:
      context: .
      dockerfile: ./docker/httpd.Dockerfile
    depends_on:
      - database
    ports:
      - "80:80"
    environment:
      # read-only account created by scripts/provision.py
      DATABASE_USER: col_ro
      DATABASE_PASSWORD: ${DATABASE_RO_PASSWORD}
    restart: unless-stopped
  provision:
    build:
      context: .
      dockerfile: ./docker/provision.Dockerfile
    depends_on:
      - database
    volumes:
      - ./data:/home/col/data
      - ./scripts:/home/col/scripts
    environment:
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      DATABASE_RO_PASSWORD: ${DATABASE_RO_PASSWORD}
    entrypoint: python /home/col/scripts/provision.py
    tty: true

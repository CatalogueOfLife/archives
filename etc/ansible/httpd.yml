- hosts: httpd
  gather_facts: false
  become: true
  become_user: root
  become_method: sudo
  
  tasks:
  - name: install python
    raw: test -e /usr/bin/python || (apt -y update && apt install -y python2.7 python3 python-minimal python3-minimal)

- hosts: httpd
  become: true
  become_user: root
  become_method: sudo
  roles:
    - httpd

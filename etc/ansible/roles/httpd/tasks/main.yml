---
- name: Update /etc/hosts
  lineinfile:
    path: /etc/hosts
    regexp: '^127.0.1.1[ \t]+ubuntu-bionic[ \t]+ubuntu-bionic'
    line: '127.0.1.1    {{ host.fqdn }}   {{ host.short }}'
    state: present
    backrefs: yes
  tags: hostname

- name: Auto-remove unneeded dependencies and auto-clean
  apt:
    autoremove=yes
    autoclean=yes
  tags: software

- debug:
    msg: Database password is {{ DATABASE_PASSWORD }}

- name: Configure 2005ac database password
  lineinfile:
    path: /usr/lib/apache2/htdocs/annual-checklist/2005/connect_to_database.php
    regexp: '.*\$link.*'
    line: '$link = mysql_connect("database", "root", "{{ DATABASE_PASSWORD }}") or die("Error: connection failure: " . mysql_error());'

- name: Configure 2006ac database password
  lineinfile:
    path: /usr/lib/apache2/htdocs/annual-checklist/2006/ac_config.php
    regexp: '.*\$sql_password.*'
    line: '$sql_password = "{{ DATABASE_PASSWORD }}" ;'


<VirtualHost *:80>
  ServerName archives.catalogueoflife.org
  ServerAdmin webmaster@naturalis.nl

  ## Vhost docroot
  DocumentRoot "/usr/lib/apache2/htdocs/annual-checklist"
  ## Alias declarations for resources outside the DocumentRoot
  Alias /annual-checklist/2019 "/usr/lib/apache2/htdocs/annual-checklist/2019/public"
  Alias /annual-checklist/2018 "/usr/lib/apache2/htdocs/annual-checklist/2018/public"
  Alias /annual-checklist/2017 "/usr/lib/apache2/htdocs/annual-checklist/2017/public"
  Alias /annual-checklist/2016 "/usr/lib/apache2/htdocs/annual-checklist/2016/public"
  Alias /annual-checklist/2015 "/usr/lib/apache2/htdocs/annual-checklist/2015/public"
  Alias /annual-checklist/2014 "/usr/lib/apache2/htdocs/annual-checklist/2014/public"
  Alias /annual-checklist/2013 "/usr/lib/apache2/htdocs/annual-checklist/2013/public"
  Alias /annual-checklist/2012 "/usr/lib/apache2/htdocs/annual-checklist/2012/public"
  Alias /annual-checklist/2011 "/usr/lib/apache2/htdocs/annual-checklist/2011/public"
  Alias /annual-checklist/2010 "/usr/lib/apache2/htdocs/annual-checklist/2010/public"
  Alias /annual-checklist/2009 "/usr/lib/apache2/htdocs/annual-checklist/2009"
  Alias /annual-checklist/2008 "/usr/lib/apache2/htdocs/annual-checklist/2008"
  Alias /annual-checklist/2007 "/usr/lib/apache2/htdocs/annual-checklist/2007"
  Alias /annual-checklist/2006 "/usr/lib/apache2/htdocs/annual-checklist/2006"
  Alias /annual-checklist/2005 "/usr/lib/apache2/htdocs/annual-checklist/2005"

 ## Directories, there should at least be a declaration for /var/www

  <Directory "/usr/lib/apache2/htdocs/annual-checklist">
    Options -Indexes +FollowSymLinks +MultiViews
    AllowOverride All
    Require all granted
  </Directory>

  ## Logging
  ErrorLog "/var/log/apache2/workbench.catalogueoflife.org_error.log"
  ServerSignature Off
  CustomLog "/var/log/apache2/workbench.catalogueoflife.org_access.log" combined

  ## Server aliases
  ServerAlias *.catalogueoflife.org
</VirtualHost>


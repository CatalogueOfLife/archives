# Hide the Apache/OS version (overrides conf-enabled/security.conf, which is read first)
ServerTokens Prod

<VirtualHost *:80>
  ServerName archives.catalogueoflife.org
  ServerAlias *.catalogueoflife.org
  ServerAdmin admin@catalogueoflife.org

  # DB credentials for the PHP apps (read with getenv)
  PassEnv DATABASE_USER DATABASE_PASSWORD

  # Empty docroot: only the per-year aliases below are served, never the app trees themselves
  DocumentRoot "/var/www/html"
  # The Zend apps (2010+) are served from their public/ dir, the older ones from the year dir.
  # Each Zend app's public/.htaccess RewriteBase must match its alias.
  Alias /annual-checklist/2019 "/var/www/annual-checklist/2019/public"
  Alias /annual-checklist/2018 "/var/www/annual-checklist/2018/public"
  Alias /annual-checklist/2017 "/var/www/annual-checklist/2017/public"
  Alias /annual-checklist/2016 "/var/www/annual-checklist/2016/public"
  Alias /annual-checklist/2015 "/var/www/annual-checklist/2015/public"
  Alias /annual-checklist/2014 "/var/www/annual-checklist/2014/public"
  Alias /annual-checklist/2013 "/var/www/annual-checklist/2013/public"
  Alias /annual-checklist/2012 "/var/www/annual-checklist/2012/public"
  Alias /annual-checklist/2011 "/var/www/annual-checklist/2011/public"
  Alias /annual-checklist/2010 "/var/www/annual-checklist/2010/public"
  Alias /annual-checklist/2009 "/var/www/annual-checklist/2009"
  Alias /annual-checklist/2008 "/var/www/annual-checklist/2008"
  Alias /annual-checklist/2007 "/var/www/annual-checklist/2007"
  Alias /annual-checklist/2006 "/var/www/annual-checklist/2006"
  Alias /annual-checklist/2005 "/var/www/annual-checklist/2005"

  <Directory "/var/www/annual-checklist">
    Options -Indexes +FollowSymLinks +MultiViews
    AllowOverride All
    Require all granted
  </Directory>

  # Never serve backups, config, build or docs files, nor the 2009 include dir
  <FilesMatch "(~|\.(bak|orig|tpl|ini|xml\.tpl|sql|sys|db|txt)|^build\.(xml|properties))$">
    Require all denied
  </FilesMatch>
  <Files "robots.txt">
    Require all granted
  </Files>
  <DirectoryMatch "^/var/www/annual-checklist/2009/includes">
    Require all denied
  </DirectoryMatch>

  Header always set X-Content-Type-Options "nosniff"
  Header always set Referrer-Policy "strict-origin-when-cross-origin"
  Header always set Content-Security-Policy "default-src 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; object-src 'none'; base-uri 'self'; frame-ancestors 'self'"

  ErrorLog ${APACHE_LOG_DIR}/error.log
  CustomLog ${APACHE_LOG_DIR}/access.log combined
  ServerSignature Off
</VirtualHost>

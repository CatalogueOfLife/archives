; Overrides on top of php.ini-production for the Annual Checklist archives.

expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /dev/stderr
error_reporting = E_ALL & ~E_DEPRECATED
memory_limit = 256M
max_execution_time = 60

; Defence in depth for CVE-2026-109618 / CVE-2026-109619 (the real fix is the PHP version).
; None of the apps accepts uploads.
file_uploads = Off
post_max_size = 8M
upload_max_filesize = 2M
session.upload_progress.enabled = 0

; Sessions are used for search state only
session.cookie_httponly = 1
session.use_strict_mode = 1
